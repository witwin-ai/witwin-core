[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "witwin"
version = "0.4.0"
description = "Witwin shared logical-world, geometry, material, and dynamics contracts"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"

dependencies = [
    "numpy>=1.24",
    "torch>=2.10",
]

[project.optional-dependencies]
maxwell = ["witwin-maxwell>=0.2,<0.3"]
radar   = ["witwin-radar>=0.3,<0.4"]
genesis = ["witwin-genesis>=0.1,<0.2"]
all     = [
    "witwin-maxwell>=0.2,<0.3",
    "witwin-radar>=0.3,<0.4",
    "witwin-genesis>=0.1,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["witwin"]
